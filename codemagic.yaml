workflows:
  android-ma-famille:
    name: Ma Famille (APK Android)
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      node: 20
      java: 17
    scripts:
      - name: Preparer le site
        script: mkdir -p www && cp index.html config.js www/
      - name: Installer les dependances
        script: npm install
      - name: Creer le projet Android
        script: |
          npx cap add android
          npx cap sync android
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
      - name: Compiler l APK
        script: cd android && ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/**/*.apk
