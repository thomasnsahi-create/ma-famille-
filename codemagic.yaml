workflows:
  android-ma-famille:
    name: Ma Famille (APK Android)
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      node: 20
      java: 17
    scripts:
      - name: Extraire le projet
        script: |
          set -e
          echo "Fichiers du depot :" && ls -la
          [ -f ma-famille.zip ] || { echo "ERREUR : ma-famille.zip est absent a la racine du depot"; exit 1; }
          rm -rf app && unzip -o ma-famille.zip -d app
      - name: Appliquer la configuration Supabase
        script: |
          set -e
          [ -f config.js ] || { echo "ERREUR : config.js est absent a la racine du depot"; exit 1; }
          if grep -q "VOTRE" config.js; then echo "ERREUR : config.js contient encore les valeurs d exemple"; exit 1; fi
          cp config.js app/www/config.js
      - name: Installer les dependances
        script: |
          set -e
          cd app && npm install
      - name: Creer le projet Android
        script: |
          set -e
          cd app
          npx cap add android
          npx cap sync android
          if [ -n "$ANDROID_SDK_ROOT" ]; then echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties; fi
      - name: Compiler l APK
        script: |
          set -e
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          cd app/android && ./gradlew assembleDebug
    artifacts:
      - app/android/app/build/outputs/**/*.apk
